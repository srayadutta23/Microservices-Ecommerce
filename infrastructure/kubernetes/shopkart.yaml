# ---------------------------------------------------------------- API gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopkart
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: sraya23/ecommerce-api-gateway:v1.0.0
          ports:
            - containerPort: 4000
          env:
            - { name: PORT, value: "4000" }
            - { name: NODE_ENV, value: "production" }
            - { name: CLIENT_URL, value: "http://localhost:5173" }
            - { name: ALLOWED_ORIGINS, value: "http://localhost:5173,http://127.0.0.1:5173" }
            - { name: PRODUCT_SERVICE_URL, value: "http://product-service:5002" }
            - { name: USER_SERVICE_URL, value: "http://user-service:5001" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service:5003" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopkart
spec:
  selector: { app: api-gateway }
  ports:
    - port: 4000
      targetPort: 4000
---
# ---------------------------------------------------------------- Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopkart
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: sraya23/ecommerce-frontend:v1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopkart
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
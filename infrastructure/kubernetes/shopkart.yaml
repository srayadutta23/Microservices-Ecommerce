# ---------------------------------------------------------------- MongoDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: shopkart
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: shopkart
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
        - name: mongodb
          image: mongo:7-jammy
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: shopkart
spec:
  selector: { app: mongodb }
  ports:
    - port: 27017
      targetPort: 27017
---
# ---------------------------------------------------------------- User service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopkart
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: sraya23/ecommerce-user-service:v1.0.0
          ports:
            - containerPort: 5001
          env:
            - { name: PORT, value: "5001" }
            - { name: NODE_ENV, value: "production" }
            - { name: MONGO_URI, value: "mongodb://mongodb:27017/user_db" }
            - { name: JWT_EXPIRES_IN, value: "1d" }
            - { name: ALLOWED_ORIGIN, value: "http://localhost:5173" }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: shopkart-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopkart
spec:
  selector: { app: user-service }
  ports:
    - port: 5001
      targetPort: 5001
---
